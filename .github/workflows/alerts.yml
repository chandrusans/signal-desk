name: Signal Desk alert runner

# Vercel's free plan allows cron only once a day, so the schedule lives here.
# Each tick asks the deployed app to run the alert engine once; the app holds
# all state and dedup, so a missed or duplicated tick is harmless.
#
# Secret on the repo:
#   RUN_KEY   must equal the RUN_KEY env var on Vercel (sent as a bearer header,
#             never in the URL). The app URL is fixed here on purpose: a repo
#             variable could be pointed at another host to capture the key.
# This log is PUBLIC (public repo): only counts are printed, never alert text.

on:
  schedule:
    # US cash session, every 5 min, Mon–Fri (13:30–20:00 UTC = 09:30–16:00 ET during DST; shift by an hour in winter)
    - cron: '*/5 13-21 * * 1-5'
    # Around the clock every 30 min: crypto, positions, overnight filings
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app to run the alert engine
        env:
          APP_URL: https://signal-desk-virid.vercel.app
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          set -e
          if [ -z "$RUN_KEY" ]; then echo "RUN_KEY secret missing"; exit 1; fi
          out=$(curl -sS --max-time 90 -H "Authorization: Bearer $RUN_KEY" "$APP_URL/api/notify?op=run")
          # Print counts only — this log is world-readable.
          echo "$out" | jq -c '{ok, fired, delivered, sourcesDown, error}' 2>/dev/null || echo "runner returned non-JSON"
          # "nothing synced yet" is a valid state before the user's first sync, not a failure
          echo "$out" | grep -Eq '"ok":true|nothing synced yet' || { echo "runner did not report ok"; exit 1; }
