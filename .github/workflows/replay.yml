name: Monthly ten-year replay

# Rebuilds data/replay.json — the Swing rules run day by day over ten years of the
# S&P 500 as it stood each day (tools/replay.mjs) — and commits it, which redeploys the
# site. The Swing tab's "Is it working?" section reads the file. Runs on the 2nd of each
# month; dispatch it by hand after changing any rule in strategies.js, exits.js or analyze.js.

on:
  schedule:
    - cron: '30 4 2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replay-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the replay (exits 2 and keeps the old file when the download is thin)
        env:
          SEC_UA: ${{ vars.SEC_UA }}
        run: node --max-old-space-size=6144 tools/replay.mjs
      - name: Commit if changed
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/replay.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: ten-year replay $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
